<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-Translate AI Result</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body, #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Opaque window (transparent: false) — matches the backgroundColor the
         main process sets per theme so there is no first-paint flash. */
      background: #f7f8fa;
    }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #211f1d; }
    html[data-theme="fresh"], html[data-theme="fresh"] body { background: #f2f9f7; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/windows/ai-result-entry.jsx"></script>
</body>
</html>
