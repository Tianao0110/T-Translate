<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>T-Caption</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-48.png" alt="" />
        <div>
          <h1 data-i18n="optionsTitle"></h1>
          <p data-i18n="appDesc"></p>
        </div>
      </header>
      <section class="card">
        <div id="status" class="status" data-tone="muted" role="status" aria-live="polite">
          <span class="dot"></span>
          <span id="status-text"></span>
        </div>
        <div class="actions">
          <button id="pair" class="primary" type="button" data-i18n="pair"></button>
          <button id="reconnect" type="button" data-i18n="reconnect"></button>
          <button id="forget" type="button" data-i18n="forget"></button>
        </div>
        <p class="hint" data-i18n="pairHint"></p>
        <p id="error" class="error" role="alert"></p>
      </section>
      <section class="card">
        <h2 data-i18n="sitesTitle"></h2>
        <label class="row">
          <span data-i18n="siteYoutube"></span>
          <input id="site-youtube" class="switch" type="checkbox" />
        </label>
        <label class="row">
          <span data-i18n="siteBilibili"></span>
          <input id="site-bilibili" class="switch" type="checkbox" />
        </label>
        <label class="row">
          <span>
            <span data-i18n="autoListen"></span>
            <span class="hint" data-i18n="autoListenHint"></span>
          </span>
          <input id="auto-listen" class="switch" type="checkbox" />
        </label>
      </section>
      <section class="card">
        <h2 data-i18n="cacheTitle"></h2>
        <div class="row">
          <span id="cache-stats"></span>
          <button id="cache-clear" type="button" data-i18n="cacheClear"></button>
        </div>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
