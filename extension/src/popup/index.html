<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>T-Caption</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="status" class="status" data-tone="muted" role="status" aria-live="polite">
      <span class="dot"></span>
      <span>
        <span id="status-text"></span>
        <span id="channel-text" class="sub"></span>
      </span>
    </div>
    <div id="allow-row" class="allow" hidden>
      <button id="allow" class="primary" type="button"></button>
      <span id="allow-note" class="sub" role="alert"></span>
    </div>

    <div class="controls">
      <label class="row" id="site-row" hidden>
        <span id="site-label"></span>
        <input id="site-on" class="switch" type="checkbox" />
      </label>
      <label class="row">
        <span data-i18n="popupEnabled"></span>
        <input id="enabled" class="switch" type="checkbox" />
      </label>
      <div class="row">
        <span data-i18n="popupDisplay"></span>
        <div class="segmented" id="display" role="radiogroup">
          <label><input type="radio" name="display" value="bilingual" /><span data-i18n="displayBilingual"></span></label>
          <label><input type="radio" name="display" value="translation" /><span data-i18n="displayTranslation"></span></label>
          <label><input type="radio" name="display" value="original" /><span data-i18n="displayOriginal"></span></label>
        </div>
      </div>
      <div class="row">
        <span data-i18n="popupSize"></span>
        <div class="segmented" id="size" role="radiogroup">
          <label><input type="radio" name="size" value="small" /><span data-i18n="sizeSmall"></span></label>
          <label><input type="radio" name="size" value="medium" /><span data-i18n="sizeMedium"></span></label>
          <label><input type="radio" name="size" value="large" /><span data-i18n="sizeLarge"></span></label>
          <label><input type="radio" name="size" value="xlarge" /><span data-i18n="sizeXlarge"></span></label>
        </div>
      </div>
      <div class="row">
        <span data-i18n="popupMode"></span>
        <div class="segmented" id="mode" role="radiogroup">
          <label><input type="radio" name="mode" value="track" /><span data-i18n="modeTrack"></span></label>
          <label><input type="radio" name="mode" value="overlay" /><span data-i18n="modeOverlay"></span></label>
        </div>
      </div>
      <label class="row">
        <span data-i18n="popupTarget"></span>
        <select id="target"></select>
      </label>
    </div>

    <div class="footer">
      <button id="export" type="button" data-i18n="exportSrt" disabled></button>
      <a id="open-options" href="options.html" data-i18n="openOptions"></a>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
